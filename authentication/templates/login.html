<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#4e73df,#1cc88a);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .login-card{
            width:100%;
            max-width:420px;
            background:#fff;
            padding:40px;
            border-radius:15px;
            box-shadow:0 15px 35px rgba(0,0,0,0.2);
        }

        .login-card h1{
            text-align:center;
            margin-bottom:30px;
            color:#4e73df;
            font-weight:bold;
        }

        .form-control{
            height:50px;
            margin-bottom:18px;
            border-radius:10px;
        }

        .form-control:focus{
            border-color:#4e73df;
            box-shadow:0 0 8px rgba(78,115,223,.3);
        }

        .btn-login{
            width:100%;
            height:48px;
            border-radius:10px;
            font-size:18px;
            font-weight:bold;
            transition:.3s;
        }

        .btn-login:hover{
            transform:translateY(-2px);
            box-shadow:0 8px 20px rgba(0,0,0,.2);
        }

        .signup-text{
            text-align:center;
            margin-top:20px;
        }

        .signup-text a{
            text-decoration:none;
            font-weight:bold;
            color:#4e73df;
        }

        .signup-text a:hover{
            text-decoration:underline;
        }

        .message{
            border-radius:8px;
            text-align:center;
            margin-bottom:15px;
            padding:10px;
        }

        .logo{
            text-align:center;
            font-size:50px;
            margin-bottom:10px;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">🔒</div>

    <h1>Login</h1>

    {% for message in messages %}
    <div class="alert alert-info message">
        {{ message }}
    </div>
    {% endfor %}

    <form action="" method="POST">
        {% csrf_token %}

        <input
            type="text"
            class="form-control"
            name="username"
            placeholder="Enter Username"
            required
        >

        <input
            type="password"
            class="form-control"
            name="password"
            placeholder="Enter Password"
            required
        >

        <button type="submit" class="btn btn-primary btn-login">
            Login
        </button>

        <div class="signup-text">
            <p class="mt-3 mb-1">Don't have an account?</p>
            <a href="sign_up">Create Account</a>
        </div>

    </form>

</div>

</body>
</html>
